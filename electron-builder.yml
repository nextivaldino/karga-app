appId: com.nextlab.kragadesktop
productName: Kraga Desktop
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asarUnpack:
  - '**/*.node'
mac:
  target: dmg
  category: public.app-category.business
  icon: icons/karga.icns
win:
  target:
    - nsis
    - portable
  icon: icons/karga.icns
linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: icons/karga.icns
