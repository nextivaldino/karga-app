appId: com.nextlab.kragadesktop
productName: KragaDesktop
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asarUnpack:
  - '**/*.node'
mac:
  target: dmg
  category: public.app-category.business
  icon: icons/karga.icns
win:
  target:
    - nsis
    - portable
  icon: icons/karga.icns
linux:
  target:
    - deb
  category: Office
  executableName: kraga-desktop
  packageCategory: utility
  icon: icons/karga.icns
  desktop:
    Name: Kraga Desktop
    Comment: Gestão de cargas consolidadas e expedições marítimas
    Terminal: false
    Type: Application
    Categories: Office;
